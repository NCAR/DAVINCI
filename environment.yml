name: davinci
channels:
  - conda-forge
  - defaults
dependencies:
  # Python version
  - python=3.13

  # Core scientific stack
  - numpy=2.4.*
  - numba=0.65.*
  - pandas=3.0.*
  - xarray=2026.4.*
  - scipy=1.18.*
  - dask=2026.6.*
  - distributed=2026.6.*
  - statsmodels=0.14.*

  # Atmospheric/geoscience stack
  - monet=2.3.*
  - monetio=0.3.*
  - cartopy=0.25.*
  - pyresample=1.35.*
  - xesmf=0.9.*
  - esmpy=8.9.*

  # Additional I/O support
  - netCDF4=1.7.*
  - h5py=3.16.*
  - h5netcdf=1.8.*
  - pyhdf  # HDF4/HDF-EOS for MODIS

  # Plotting
  - matplotlib=3.11.*
  - seaborn=0.13.*

  # Configuration/CLI/AI support
  - pydantic
  - pyyaml
  - typer
  - anthropic
  - earthaccess

  # Progress display
  - tqdm
  - rich

  # Development tools
  - pytest
  - pytest-cov
  - mypy
  - black
  - isort

  # Pip is included for post-create editable installs. Install pip packages
  # explicitly with --no-deps so pip cannot overlay the conda scientific stack:
  #   python -m pip install --no-deps pycwt==0.4.0b0
  #   python -m pip install --no-deps -e .
  - pip
