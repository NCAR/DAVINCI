# MERRA-2 evaluated against NASA POWER.
#
# Two legs that look alike and mean opposite things — read this before quoting
# any number out of this run:
#
#   Leg A (SWGDN vs ALLSKY_SFC_SW_DWN) is a GENUINE EVALUATION. POWER's solar
#     derives from CERES SYN1deg, which is independent of the GEOS radiation
#     scheme that produced MERRA-2's SWGDN. A bias here is a real result.
#
#   Leg B (T2M vs T2M) is CIRCULAR — a traceability check, not a result.
#     POWER's meteorology *is* MERRA-2, served on MERRA-2's own native grid.
#     The two must agree; if they do not, this reader is wrong. Never present
#     leg B as an evaluation, and never present leg A unless leg B passed —
#     an unvalidated reader turns every bias into "GEOS, or our bug?"
#
# Staging (long pole — start first; /Volumes/Io is not mounted everywhere, so
# pass --root explicitly):
#   davinci-stage-merra2 --collection tavg1_2d_rad_Nx --start 2024-02 --end 2024-02 \
#     --root ${POWER_DATA} --dry-run      # drop --dry-run to stage
#   davinci-stage-merra2 --collection tavg1_2d_slv_Nx --start 2024-02 --end 2024-02 \
#     --root ${POWER_DATA}
#
#   export POWER_DATA=~/Data/POWER
#   export POWER_ANALYSIS=$(pwd)
#   export POWER_CACHE=${POWER_ANALYSIS}/cache
#   davinci-monet run configs/power-merra2.example.yaml

analysis:
  start_time: "2024-02-01"
  end_time: "2024-02-29"
  output_dir: ${POWER_ANALYSIS}/output
  log_dir: ${POWER_ANALYSIS}/logs
  # KNOWN LIMITATION: the spatial_bias map draws the whole globe for this
  # CONUS-only data. Analysis-level `domain` and per-plot `domain_type` only
  # set the extent for SINGLE-SOURCE spatial plots; on a PAIRED spatial_bias
  # they filter the data (already regional here) but not the map extent. Fixing
  # the paired-map extent needs a shared renderer change (not yet approved), so
  # no domain key is set here -- it would imply a fix that does not apply.
  style:
    theme: ncar
    context: presentation

sources:
  # ONE merra2 source spanning both collections. They share a grid and a time
  # axis and differ only in which variables they carry, so open_mfdataset
  # combines them by coords. Keeping them as separate `merra2_rad`/`merra2_slv`
  # sources leaks the collection suffix into every axis label ("MERRA-2 Rad
  # Allsky SFC SW Dwn") -- the source key IS the display name, so the key has
  # to name the source, not the file layout.
  #
  # radius_of_influence MUST be set. Its default (12 km) is far smaller than a
  # MERRA-2 cell: 0.5 x 0.625 deg is ~55 x 53 km at 40N, so the nearest cell
  # centre can sit ~38 km from a site and EVERY site gets dropped -- the run
  # still "succeeds", silently, with N=0. 50 km covers the half-diagonal while
  # still selecting the genuinely nearest cell, which is what POWER's point
  # endpoint returns too.
  merra2:
    type: merra2
    files:
      - ${POWER_DATA}/MERRA2_tavg1/rad_Nx/*.nc4   # tavg1_2d_rad_Nx (M2T1NXRAD)
      - ${POWER_DATA}/MERRA2_tavg1/slv_Nx/*.nc4   # tavg1_2d_slv_Nx (M2T1NXSLV)
    radius_of_influence: 50000
    variables:
      SWGDN: {units: "W m-2"}     # GEOS radiation scheme's own answer
      T2M: {units: K}

  power:
    type: power
    temporal: hourly       # matches MERRA-2 tavg1 natively — no aggregation either side
    community: RE
    cache_dir: ${POWER_CACHE}
    # No time_standard knob: the reader always requests time-standard=UTC.
    # POWER's own default is LST, which would phase-shift this against MERRA-2
    # by ~7 h at Boulder and make leg B look like a reader bug.
    sites:
      - {name: boulder,   latitude: 40.02,  longitude: -105.27}
      - {name: table_mtn, latitude: 40.125, longitude: -105.24}
      - {name: desert_rock, latitude: 36.626, longitude: -116.018}
      - {name: bondville, latitude: 40.052, longitude: -88.373}
    variables:
      ALLSKY_SFC_SW_DWN: {}   # CERES-derived -> INDEPENDENT of MERRA-2. Evaluation.
      T2M: {}                 # MERRA-2-derived -> CIRCULAR. Traceability only.

  # Daily counterparts of the two sources above, at the SAME sites. These exist
  # so the hourly-vs-daily correlation question is answered BY THE PIPELINE
  # rather than by a side script: the hourly leg's R is inflated by the diurnal
  # cycle (night hours agree trivially at 0), and the only honest way to show
  # that is to compute both legs through the same path and compare.
  merra2_daily:
    type: merra2
    files: ${POWER_DATA}/MERRA2_tavg1/rad_Nx/*.nc4
    radius_of_influence: 50000
    resample: "1D"          # hourly tavg1 -> daily mean, to match POWER daily
    variables:
      SWGDN: {units: "W m-2"}

  power_daily:
    type: power
    temporal: daily         # daily solar arrives as kW-hr/m^2/day -> W m-2
    community: RE
    cache_dir: ${POWER_CACHE}
    sites:
      - {name: boulder,     latitude: 40.02,  longitude: -105.27}
      - {name: table_mtn,   latitude: 40.125, longitude: -105.24}
      - {name: desert_rock, latitude: 36.626, longitude: -116.018}
      - {name: bondville,   latitude: 40.052, longitude: -88.373}
    variables:
      ALLSKY_SFC_SW_DWN: {}

  power_regional:
    type: power
    # DAILY, not hourly: POWER has no hourly/regional endpoint (it 404s with an
    # HTML page). hourly/regional is the ONLY unsupported temporal x mode cell.
    temporal: daily
    community: RE
    cache_dir: ${POWER_CACHE}
    # Regional needs >= 2 deg on BOTH axes; anything smaller is a 422.
    bbox: {lat_min: 30, lat_max: 50, lon_min: -125, lon_max: -100}
    variables:
      ALLSKY_SFC_SW_DWN: {}   # daily solar arrives as kW-hr/m^2/day -> W m-2

pairs:
  # Leg A — EVALUATION.
  merra2_vs_power_swdn:
    x: {source: power,      variable: ALLSKY_SFC_SW_DWN}
    y: {source: merra2, variable: SWGDN}

  # Leg A, DAILY — same sites, same quantity, same code path as the hourly leg
  # above; only the averaging differs. Compare this R against the hourly leg's:
  # the drop is the diurnal cycle leaving the correlation, not skill changing.
  # Quote the daily R in the talk.
  merra2_vs_power_swdn_daily:
    x: {source: power_daily,      variable: ALLSKY_SFC_SW_DWN}
    y: {source: merra2_daily, variable: SWGDN}

  # Leg B — TRACEABILITY. Circular by construction; this is the reader's test.
  merra2_vs_power_t2m:
    x: {source: power,      variable: T2M}
    y: {source: merra2, variable: T2M}

  # Leg A regional — the grids genuinely differ: POWER solar arrives on CERES
  # SYN1deg's native 1.0 deg, MERRA-2 SWGDN is 0.5 x 0.625. Bin both onto the
  # COARSER grid; gridding to 0.5 would upsample POWER and invent structure.
  #
  # NOTE the asymmetry with the point legs above: POWER has no hourly/regional
  # endpoint, so this leg is DAILY on the POWER side while the point legs are
  # hourly. time_resolution: 1D brings MERRA-2's hourly SWGDN down to match.
  # The map and the scatter therefore answer different questions — the map is a
  # daily-mean bias, the scatter is an hourly bias. Say so if both appear in
  # the talk; a daily-mean bias hides compensating diurnal errors.
  merra2_vs_power_regional_swdn:
    x: {source: power_regional, variable: ALLSKY_SFC_SW_DWN}
    y: {source: merra2, variable: SWGDN}
    method: grid
    grid:
      horizontal_res: 1.0
      time_resolution: 1D
      min_sample_count: 1

plots:
  swdn_scatter:
    type: scatter
    pairs: [merra2_vs_power_swdn]
    title: "Surface Downwelling Shortwave"
    show_density: true

  swdn_timeseries:
    type: timeseries
    pairs: [merra2_vs_power_swdn]
    title: "Surface Downwelling Shortwave"

  swdn_scatter_daily:
    type: scatter
    pairs: [merra2_vs_power_swdn_daily]
    title: "Surface Downwelling Shortwave, Daily Mean"
    show_density: true

  swdn_spatial_bias:
    type: spatial_bias
    pairs: [merra2_vs_power_regional_swdn]
    title: "Surface Downwelling Shortwave Bias"

  # Leg B plots are labelled as the consistency check they are, so a reader
  # skimming the output directory cannot mistake them for a result.
  t2m_scatter_traceability:
    type: scatter
    pairs: [merra2_vs_power_t2m]
    title: "2 m Temperature Consistency Check"

stats:
  metrics: [N, MB, RMSE, R, NMB, NME, IOA]

summary:
  enabled: true
  model: claude-haiku-4-5
