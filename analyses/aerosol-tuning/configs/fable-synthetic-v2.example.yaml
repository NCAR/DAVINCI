# Synthetic-only FABLE v2 fit. FABLE_SYNTH points at a generated bundle root.
# This fitting config deliberately contains no evaluation-truth source.

analysis:
  workflow: synthetic_fit
  start_time: "2001-01-01 00:00:00"
  end_time: "2006-12-31 23:59:59"
  output_dir: ${FABLE_SYNTH}/output
  log_dir: ${FABLE_SYNTH}/logs

sources:
  model_hourly:
    type: generic
    files: ${FABLE_SYNTH}/inputs/model/MERRA2_SYNTH.tavg1_2d_aer_Nx.nc4
    variables: {TOTEXTTAU: {units: "1"}}
    time_padding: "1D"
  sensor_a_raw:
    type: satellite_l3
    files: ${FABLE_SYNTH}/inputs/obs/sensor_a.nc
    qa_variable: QA
    qa_values: [3]
    variables:
      aod_550nm: {units: "1"}
      reported_sigma_log: {units: "1"}
      common_error_factor: {units: "1"}
      QA: {units: "1"}
  sensor_b_raw:
    type: satellite_l3
    files: ${FABLE_SYNTH}/inputs/obs/sensor_b.nc
    qa_variable: QA
    qa_values: [3]
    variables:
      aod_550nm: {units: "1"}
      reported_sigma_log: {units: "1"}
      common_error_factor: {units: "1"}
      QA: {units: "1"}

analyses:
  model_daily:
    type: aod_preprocess
    source: model_hourly
    variable: TOTEXTTAU
    sample_local_time: 13.5
    day_anchor_hour: 12.0
    target_grid: 30.0
    log_epsilon: 0.01
    required: true
  sensor_a_daily:
    type: aod_preprocess
    source: sensor_a_raw
    variable: aod_550nm
    uncertainty_variable: reported_sigma_log
    common_factor_variables: [common_error_factor]
    day_anchor_hour: 12.0
    target_grid_from: model_daily
    log_epsilon: 0.01
    required: true
  sensor_b_daily:
    type: aod_preprocess
    source: sensor_b_raw
    variable: aod_550nm
    uncertainty_variable: reported_sigma_log
    common_factor_variables: [common_error_factor]
    day_anchor_hour: 12.0
    target_grid_from: model_daily
    log_epsilon: 0.01
    required: true
  aod_basis:
    type: eof
    source: model_daily
    variable: log_aod
    n_modes: 3
    remove_seasonal_cycle: true
    standardize: false
    rotation: none
    solver: full
    fit_window: {start: "2001-01-01", end: "2002-12-31 23:59:59"}
    required: true
  obs_pcs:
    type: eof_projection
    basis: aod_basis
    model: model_daily
    model_variable: log_aod
    obs:
      - source: sensor_a_daily
        variable: log_aod
        error_variable: obs_error_std
        common_factor_variables: [common_error_factor]
      - source: sensor_b_daily
        variable: log_aod
        error_variable: obs_error_std
        common_factor_variables: [common_error_factor]
    ridge: 1.0
    bias_fit_window: {start: "2003-01-01", end: "2004-12-31 23:59:59"}
    bias_fit_method: joint_seasonal
    sensor_offset_method: none
    joint_bias_laplacian_strength: 1.0
    joint_bias_tolerance: 1.0e-6
    joint_bias_max_iterations: 20
    clim_bias: true
    spatial_support: monthly_taper
    support_min_fraction: 0.2
    support_full_fraction: 0.5
    support_smoothing_passes: 2
    delta_bounds: [-1.6094379, 1.6094379]
    min_resolution: 0.3
    required: true
  filtered_pcs:
    type: wavelet_filter
    source: obs_pcs
    variable: pc
    min_resolution: 0.3
    keep_significant: false
    significance_level: 0.95
    band: {min: 4, max: 180, units: days}
    max_bridge_days: 7
    min_segment_days: 360
    omega0: 6.0
    required: true
  scaling:
    type: aod_scaling
    basis: aod_basis
    projection: obs_pcs
    coefficients: filtered_pcs
    model: model_daily
    r_bounds: [0.2, 5.0]
    aod_floor: 0.001
    required: true
  corrected:
    type: mmr_writer
    scaling: scaling
    files: ${FABLE_SYNTH}/inputs/mmr/*.nc4
    species: null
    output_dir: ${FABLE_SYNTH}/corrected
    time_interp: log_linear
    outside_coverage: identity
    overwrite: false
    required: true
